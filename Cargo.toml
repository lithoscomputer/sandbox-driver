[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bollard = "0.18"
clap = { version = "=4.5.47", features = ["derive"] }
daytona-api-client = { git = "https://github.com/brynary/daytona-sdk-rust", rev = "7de0d4ce7cede28d4f46bc58aafc8cb9210c122d", package = "daytona-api-client" }
daytona-sdk = { git = "https://github.com/brynary/daytona-sdk-rust", rev = "7de0d4ce7cede28d4f46bc58aafc8cb9210c122d", package = "daytona-sdk" }
futures-util = "0.3"
globset = "0.4"
nix = { version = "0.30", features = ["signal"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false }
reqwest-middleware = "0.5"
sandbox-driver = { path = "crates/sandbox-driver" }
sandbox-driver-conformance = { path = "crates/sandbox-driver-conformance" }
sandbox-driver-host = { path = "crates/sandbox-driver-host" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
tokio-util = "0.7"
toml = "=0.8.23"
tracing = "0.1"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
trycmd = "=1.2.1"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
allow_attributes_without_reason = "warn"

implicit_hasher = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"

print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
disallowed_methods = "deny"
exit = "warn"
get_unwrap = "warn"
unwrap_used = "deny"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
use_self = "warn"
wildcard_imports = "warn"
absolute_paths = "warn"
