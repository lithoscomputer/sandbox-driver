name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install locked tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.6.11
          install_args: --locked --jobs=1
          cache: false

      - name: Build release archive
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: mise run release "$RELEASE_TARGET" "$RELEASE_VERSION"

      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            dist-release/*.tar.gz
            dist-release/*.sha256
          if-no-files-found: error

  publish:
    name: draft release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh release create "$TAG" --repo "$REPOSITORY" --draft --verify-tag --title "$TAG" dist/*
