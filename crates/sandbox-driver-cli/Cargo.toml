[package]
name = "sandbox-driver-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Command-line interface for sandbox-driver providers"

[lints]
workspace = true

[[bin]]
name = "lithos-sandbox"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
nix = { workspace = true, features = ["term"] }
sandbox-driver.workspace = true
sandbox-driver-daytona = { path = "../sandbox-driver-daytona" }
sandbox-driver-docker = { path = "../sandbox-driver-docker" }
sandbox-driver-host = { path = "../sandbox-driver-host" }
sandbox-driver-protocol = { path = "../sandbox-driver-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "process", "rt-multi-thread", "signal"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
