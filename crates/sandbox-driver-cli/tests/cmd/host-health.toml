bin.name = "lithos-sandbox"
args = ["--provider", "host", "--events", "off", "provider", "health"]
status = "success"
stdout = """
provider: host
status: ok
"""
stderr = ""

[env]
inherit = false

[env.add]
NO_COLOR = "1"
PATH = "/usr/bin:/bin"
RUST_LOG = "off"
XDG_CONFIG_HOME = "tests/cmd/no-config"
