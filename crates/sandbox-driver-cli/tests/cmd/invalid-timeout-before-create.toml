bin.name = "lithos-sandbox"
args = ["run", "host", "--image", "alpine:3", "--timeout", "bogus", "--", "/bin/true"]
status.code = 1
stdout = ""
stderr = """
error: --timeout needs a duration with a unit, such as 30s or 5m
"""

[env]
inherit = false

[env.add]
NO_COLOR = "1"
PATH = "/usr/bin:/bin"
RUST_LOG = "off"
XDG_CONFIG_HOME = "tests/cmd/no-config"
