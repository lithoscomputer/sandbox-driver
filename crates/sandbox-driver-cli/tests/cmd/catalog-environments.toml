bin.name = "lithos-sandbox"
args = ["--config", "config.toml", "environments"]
status = "success"
stdout = """
NAME\tPROVIDER\tSOURCE
elsewhere\tremote\timage alpine:3
scratch\tlocal\thost_directory
"""
stderr = ""

[env]
inherit = false

[env.add]
NO_COLOR = "1"
PATH = "/usr/bin:/bin"
RUST_LOG = "off"
XDG_CONFIG_HOME = "tests/cmd/no-config"
