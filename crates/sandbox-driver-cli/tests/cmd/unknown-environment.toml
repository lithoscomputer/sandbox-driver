bin.name = "lithos-sandbox"
args = ["run", "nowhere", "--", "/bin/true"]
status.code = 1
stdout = ""
stderr = """
error: environment nowhere is not configured
hint: `lithos-sandbox environments` lists them
"""

[env]
inherit = false

[env.add]
NO_COLOR = "1"
PATH = "/usr/bin:/bin"
RUST_LOG = "off"
XDG_CONFIG_HOME = "tests/cmd/no-config"
