bin.name = "lithos-sandbox"
args = ["--config", "config.toml", "--output", "json", "provider", "health", "local"]
status = "success"
stdout = """
{
  "healthy": true,
  "message": null
}
"""
stderr = ""

[env]
inherit = false

[env.add]
NO_COLOR = "1"
PATH = "/usr/bin:/bin"
RUST_LOG = "off"
XDG_CONFIG_HOME = "tests/cmd/no-config"
