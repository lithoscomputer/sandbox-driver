bin.name = "lithos-sandbox"
args = [
  "--provider",
  "host",
  "--events",
  "off",
  "sandbox",
  "run",
  "--provider-config",
  "{broken",
  "--",
  "/bin/true",
]
status.code = 1
stdout = ""
stderr = """
error: parsing --provider-config as JSON
  caused by: key must be a string at line 1 column 2
"""

[env]
inherit = false

[env.add]
NO_COLOR = "1"
PATH = "/usr/bin:/bin"
RUST_LOG = "off"
XDG_CONFIG_HOME = "tests/cmd/no-config"
