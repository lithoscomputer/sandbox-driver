bin.name = "lithos-sandbox"
args = []
status.code = 2
stdout = ""
stderr = """
Manage sandboxes across sandbox-driver providers

Usage: lithos-sandbox [OPTIONS] <COMMAND>

Commands:
  provider  Inspect providers and their capabilities
  sandbox   Manage sandboxes and run commands in them
  help      Print this message or the help of the given subcommand(s)

Options:
  -p, --provider <PROVIDER>  Provider profile name, or one of: host, docker, daytona
      --config <CONFIG>      Configuration file. Defaults to the platform config directory
      --output <OUTPUT>      Format for command results [default: table] [possible values: table, json, id]
      --events <EVENTS>      Format for operation progress on stderr [default: human] [possible values: human, json, off]
  -v, --verbose...           Increase diagnostic logging. Repeat for more detail
  -h, --help                 Print help
  -V, --version              Print version
"""

[env]
inherit = false

[env.add]
NO_COLOR = "1"
PATH = "/usr/bin:/bin"
RUST_LOG = "off"
XDG_CONFIG_HOME = "tests/cmd/no-config"
