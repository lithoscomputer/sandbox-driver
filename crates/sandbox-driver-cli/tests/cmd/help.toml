bin.name = "lithos-sandbox"
args = ["--help"]
status = "success"
stdout = """
Create, inspect and drive sandboxes through the sandbox-driver catalog

Usage: lithos-sandbox [OPTIONS] <COMMAND>

Commands:
  providers     List provider entries
  provider      Inspect one provider entry
  environments  List environments
  create        Create a sandbox from an environment
  run           Create a sandbox, run one command in it, and destroy it
  find          Find sandboxes across every provider entry
  status        Show a sandbox's current status
  start         Start a stopped sandbox
  stop          Stop a sandbox, ending every command in it
  exec          Run a command in a sandbox
  shell         Open an interactive shell in a sandbox
  cp            Copy one file into or out of a sandbox
  ls            List a sandbox directory
  expose        Make a sandbox port reachable, print its URL, and hold it until Ctrl-C
  destroy       Destroy a sandbox
  help          Print this message or the help of the given subcommand(s)

Options:
      --config <CONFIG>  Catalog file. Defaults to $SANDBOX_DRIVER_CONFIG, then $XDG_CONFIG_HOME/sandbox-driver/config.toml
      --output <OUTPUT>  Format for command results [default: table] [possible values: table, json, id]
  -v, --verbose...       Show provider diagnostics on stderr. Repeat for more detail
  -h, --help             Print help
  -V, --version          Print version

A SANDBOX is the ref that `create` prints, such as docker/3f2a9c1e, or the JSON reference from `--output json`.
"""
stderr = ""

[env]
inherit = false

[env.add]
NO_COLOR = "1"
PATH = "/usr/bin:/bin"
RUST_LOG = "off"
XDG_CONFIG_HOME = "tests/cmd/no-config"
