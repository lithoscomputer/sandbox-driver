bin.name = "lithos-sandbox"
args = ["--provider", "host", "sandbox", "create", "--host-directory"]
status.code = 1
stdout = ""
stderr = """
error: Host sandbox handles do not survive CLI process exit; use `lithos-sandbox --provider host sandbox run`
"""

[env]
inherit = false

[env.add]
NO_COLOR = "1"
PATH = "/usr/bin:/bin"
RUST_LOG = "off"
XDG_CONFIG_HOME = "tests/cmd/no-config"
