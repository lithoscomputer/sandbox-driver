bin.name = "lithos-sandbox"
args = ["cp", "a.txt", "b.txt"]
status.code = 1
stdout = ""
stderr = """
error: one side of cp must be SANDBOX:PATH, such as docker/1a2b:/tmp/file
"""

[env]
inherit = false

[env.add]
NO_COLOR = "1"
PATH = "/usr/bin:/bin"
RUST_LOG = "off"
XDG_CONFIG_HOME = "tests/cmd/no-config"
