bin.name = "lithos-sandbox"
args = ["run", "host", "--keep", "--", "/bin/true"]
status.code = 1
stdout = ""
stderr = """
error: sandboxes of provider host end when this command exits, so --keep would leave nothing behind; use `lithos-sandbox run` without --keep
"""

[env]
inherit = false

[env.add]
NO_COLOR = "1"
PATH = "/usr/bin:/bin"
RUST_LOG = "off"
XDG_CONFIG_HOME = "tests/cmd/no-config"
