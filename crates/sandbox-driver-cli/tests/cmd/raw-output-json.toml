bin.name = "lithos-sandbox"
args = ["--output", "json", "run", "host", "--", "/bin/true"]
status.code = 1
stdout = ""
stderr = """
error: run streams the command's own output and requires --output table
"""

[env]
inherit = false

[env.add]
NO_COLOR = "1"
PATH = "/usr/bin:/bin"
RUST_LOG = "off"
XDG_CONFIG_HOME = "tests/cmd/no-config"
