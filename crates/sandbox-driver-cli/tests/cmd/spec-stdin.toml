bin.name = "lithos-sandbox"
args = [
  "--provider",
  "host",
  "--events",
  "off",
  "sandbox",
  "run",
  "--spec",
  "-",
  "--",
  "/bin/sh",
  "-c",
  "printf '%s\\n' \"$SPEC_ENV\"",
]
stdin = '{"source":"host_directory","env":{"SPEC_ENV":"from-spec"}}'
status = "success"
stdout = """
from-spec
"""
stderr = ""

[env]
inherit = false

[env.add]
NO_COLOR = "1"
PATH = "/usr/bin:/bin"
RUST_LOG = "off"
XDG_CONFIG_HOME = "tests/cmd/no-config"
