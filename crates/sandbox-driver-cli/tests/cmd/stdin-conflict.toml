bin.name = "lithos-sandbox"
args = [
  "--provider",
  "host",
  "sandbox",
  "run",
  "--spec",
  "-",
  "--stdin",
  "--",
  "/bin/true",
]
status.code = 1
stdout = ""
stderr = """
error: --spec - and --stdin cannot read from stdin in the same command
"""

[env]
inherit = false

[env.add]
NO_COLOR = "1"
PATH = "/usr/bin:/bin"
RUST_LOG = "off"
XDG_CONFIG_HOME = "tests/cmd/no-config"
