bin.name = "lithos-sandbox"
args = ["create", "docker", "--image", "ubuntu:24.04", "--snapshot", "base"]
status.code = 2
stdout = ""
stderr = """
error: the argument '--image <IMAGE>' cannot be used with '--snapshot <SNAPSHOT>'

Usage: lithos-sandbox create --image <IMAGE> <ENVIRONMENT>

For more information, try '--help'.
"""

[env]
inherit = false

[env.add]
NO_COLOR = "1"
PATH = "/usr/bin:/bin"
RUST_LOG = "off"
XDG_CONFIG_HOME = "tests/cmd/no-config"
