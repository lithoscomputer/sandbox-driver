bin.name = "lithos-sandbox"
args = ["provider", "health", "unknown"]
status.code = 1
stdout = ""
stderr = """
error: provider entry unknown is not configured
hint: `lithos-sandbox providers` lists them
"""

[env]
inherit = false

[env.add]
NO_COLOR = "1"
PATH = "/usr/bin:/bin"
RUST_LOG = "off"
XDG_CONFIG_HOME = "tests/cmd/no-config"
