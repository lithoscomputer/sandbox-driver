bin.name = "lithos-sandbox"
args = [
  "--provider",
  "host",
  "--events",
  "off",
  "sandbox",
  "run",
  "--workspace",
  ".",
  "--",
  "/bin/echo",
  "hello from trycmd",
]
status = "success"
stdout = """
hello from trycmd
"""
stderr = ""

[env]
inherit = false

[env.add]
NO_COLOR = "1"
PATH = "/usr/bin:/bin"
RUST_LOG = "off"
XDG_CONFIG_HOME = "tests/cmd/no-config"
