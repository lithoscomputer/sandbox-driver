bin.name = "lithos-sandbox"
args = [
  "--provider",
  "host",
  "--events",
  "off",
  "sandbox",
  "run",
  "--exec-env",
  "BROKEN",
  "--",
  "/bin/true",
]
status.code = 1
stdout = ""
stderr = """
error: --exec-env must use KEY=VALUE syntax
"""

[env]
inherit = false

[env.add]
NO_COLOR = "1"
PATH = "/usr/bin:/bin"
RUST_LOG = "off"
XDG_CONFIG_HOME = "tests/cmd/no-config"
