[package]
name = "sandbox-driver-host-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Host provider served as a sandbox-driver plugin binary"

[lints]
workspace = true

[[bin]]
name = "sandbox-driver-host-plugin"
path = "src/main.rs"

[dependencies]
sandbox-driver.workspace = true
sandbox-driver-host = { path = "../sandbox-driver-host" }
sandbox-driver-protocol = { path = "../sandbox-driver-protocol" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
sandbox-driver-conformance.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process"] }
