[package]
name = "sandbox-driver-docker-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Docker provider served as a sandbox-driver plugin binary"

[lints]
workspace = true

[[bin]]
name = "sandbox-driver-docker"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
sandbox-driver.workspace = true
sandbox-driver-docker = { path = "../sandbox-driver-docker" }
sandbox-driver-protocol = { path = "../sandbox-driver-protocol" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true
