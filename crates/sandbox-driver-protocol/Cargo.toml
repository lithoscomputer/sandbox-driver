[package]
name = "sandbox-driver-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "JSON-RPC plugin protocol for sandbox-driver providers"

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
rand.workspace = true
sandbox-driver.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true

[dev-dependencies]
sandbox-driver-conformance.workspace = true
sandbox-driver-host = { path = "../sandbox-driver-host" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
