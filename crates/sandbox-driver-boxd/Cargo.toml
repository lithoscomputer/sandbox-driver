[package]
name = "sandbox-driver-boxd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "boxd.sh microVM sandbox provider for sandbox-driver"

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
futures-util.workspace = true
prost.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
rustls.workspace = true
sandbox-driver.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tokio-util = { workspace = true, features = ["io"] }
tonic = { workspace = true, features = ["channel", "codegen", "tls-ring", "tls-webpki-roots"] }
tonic-prost.workspace = true
tracing.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
hyper = { workspace = true, features = ["http2", "server"] }
hyper-util = { workspace = true, features = ["server", "service", "tokio"] }
nix = { workspace = true, features = ["process"] }
sandbox-driver-conformance.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "rt-multi-thread"] }
tonic = { workspace = true, features = ["server"] }
