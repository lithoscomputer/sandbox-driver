[package]
name = "sandbox-driver-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Host (local) sandbox provider for sandbox-driver"

[[bin]]
name = "sandbox-driver-host"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
sandbox-driver.workspace = true
sandbox-driver-protocol = { path = "../sandbox-driver-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "process", "rt", "rt-multi-thread", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
sandbox-driver-conformance.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
